<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>뚝딱거리는 커피테이블 — 메뉴</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">

    <!-- 헤더 -->
    <header class="header">
      <h1 class="brand-name">뚝딱거리는<br>커피테이블</h1>
      <p class="tagline">핸드드립 커피 & 디저트 팝업</p>
    </header>

    <hr class="divider" />

    <!-- COFFEE -->
    <section class="category">
      <p class="category-label">Coffee</p>

      <div class="menu-card">
        <div class="menu-info">
          <p class="menu-name">빈브라더스 개화</p>
          <div class="badges">
            <span class="badge hot">Hot</span>
            <span class="badge cold">Cold</span>
          </div>
          <p class="cup-note">재스민 · 복숭아</p>
        </div>
        <p class="menu-price">7,000원</p>
      </div>

      <div class="menu-card">
        <div class="menu-info">
          <p class="menu-name long">콜롬비아 캄포 에르모소<br>수단루메 워시드 C.M44</p>
          <div class="badges">
            <span class="badge hot">Hot</span>
            <span class="badge cold">Cold</span>
          </div>
          <p class="cup-note">페퍼민트 · 파파야</p>
        </div>
        <p class="menu-price">7,000원</p>
      </div>
    </section>

    <!-- BEVERAGE -->
    <section class="category">
      <p class="category-label">Beverage</p>

      <div class="menu-card">
        <div class="menu-info">
          <p class="menu-name">밀크티</p>
          <div class="badges">
            <span class="badge cold">Cold</span>
          </div>
        </div>
        <p class="menu-price">4,500원</p>
      </div>
    </section>

    <!-- DESSERT -->
    <section class="category">
      <p class="category-label">Dessert</p>

      <div class="menu-card">
        <div class="menu-info">
          <p class="menu-name">티라미수볼</p>
        </div>
        <p class="menu-price">4,000원</p>
      </div>

      <div class="menu-card">
        <div class="menu-info">
          <p class="menu-name">치즈케이크</p>
        </div>
        <p class="menu-price tbd">별도 안내</p>
      </div>
    </section>


  </div>
</body>
</html>
